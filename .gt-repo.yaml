# Repository governance for gt. This file is the source of truth; run
# 'gt repo sync' to render it, and 'gt repo check' to verify.
#
# Shared policy (Dependabot cooldown, commit-message prefixes, the weekly sync
# schedule) lives in gt's templates, not here, so it stays consistent across
# every governed repo.
#
# The pipeline stages below become jobs in ci-orchestration.yml, each calling a
# ci-*/cd-* workflow that belongs to this repository: gt creates those once and
# never touches them again. Branch protection needs exactly one check, ci-gate,
# which waits on all of them.

gt_version: v1.0.0
dependabot:
  - ecosystem: github-actions
    directory: /
  - ecosystem: npm
    directory: /
    note: |
      A yarn-workspaces monorepo (packages/brand, packages/styles, packages/ui)
      with a SINGLE yarn.lock at the root, so this must stay one entry at the
      workspace ROOT. Per-package entries would edit only those manifests,
      leave yarn.lock stale, and fail every `yarn install --immutable`.
dependabot_auto_merge:
  enabled: true
  schedule: 0 1 * * *
  max_bump: minor
  delete_branch: true
bulwark:
  # On. There is no security scanning here today, so gt's stage is an addition
  # rather than a duplicate. Expect findings on the first run; nothing gates on
  # them while ci-gate is not the required check.
  enabled: true
pipeline:
  ci:
    enabled: true
    stages:
      - preflight
      - build
      - test
      - end2end
    merge_queue: false
  # Off, and this repository is the reason cd-orchestration is not grouped by
  # ref: releases here are driven by changesets and push one tag per package
  # (@wardnet/*@*), while `changeset publish` ships every pending version on the
  # first run. Turning CD on means reconciling that with a tag-per-delivery
  # model, not just moving jobs. verify-attestation also runs with
  # require: true, and no tree carries an attestation yet.
  cd:
    enabled: false
    stages:
      - preflight
      - publish
      - deploy
      - verify
    tags:
      # release.yml uses @wardnet/*@* today; reconcile when CD is turned on.
      - v*.*.*
conventional_commits:
  enabled: true
  scope: pr_title
  types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
settings:
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
  branch_protection:
    branch: main
    required_approvals: 0
    require_up_to_date: false
files:
  - sync
  - dependabot-auto-merge
