# cd-publish — this file is yours.
#
# gt created it once and will never modify or delete it again. It is called by
# cd-orchestration.yml, which verifies the tagged tree carries a passing
# gt/validated-tree attestation before this runs.
#
# release.yml's serialisation moved to the orchestrator, which groups delivery
# per repository rather than per ref — for the reason release.yml documented:
# a release pushes one tag per package, and the first run's `changeset publish`
# ships every pending version, so per-ref runs would race and 409.
name: cd-publish

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # registry-url + scope make setup-node write an ~/.npmrc that pins the
      # @wardnet scope to GitHub Packages and authenticates via NODE_AUTH_TOKEN.
      # changeset publish shells out to `npm`, which reads that .npmrc — the
      # .yarnrc.yml npmScopes only cover yarn's own commands, not npm publish.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@wardnet"
          always-auth: true
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      # changeset publish pushes every package whose version isn't yet on the
      # registry (i.e. the ones the release PR just bumped) to GitHub Packages.
      - run: yarn release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
